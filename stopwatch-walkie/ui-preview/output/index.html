<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StopWatch Walkie UI Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#eef1f4; color:#101820; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 28%,#fff 0,#eef1f4 56%,#dfe4e8 100%); }
    main { width:min(1100px,96vw); display:grid; grid-template-columns:minmax(480px,1fr) minmax(320px,.72fr); gap:70px; align-items:center; padding:38px; }
    .stage { display:grid; place-items:center; }
    .watch { width:min(66vw,560px); aspect-ratio:1; border-radius:50%; padding:10px; background:linear-gradient(145deg,#2b3035,#090b0d 55%,#33383d); box-shadow:0 35px 80px #24303b38, inset 0 1px 1px #ffffff55; }
    .screen { width:100%; height:100%; border-radius:50%; overflow:hidden; background:#050708; box-shadow:inset 0 0 18px #000; }
    svg { display:block; width:100%; height:100%; }
    .rotor { transform-origin:233px 233px; animation:rotate 2.2s linear infinite; }
    .pulse { transform-origin:233px 233px; animation:pulse 1.4s ease-in-out infinite; }
    .bar { transform-origin:center; animation:wave .85s ease-in-out infinite alternate; }
    .bar:nth-child(2n) { animation-delay:-.35s; } .bar:nth-child(3n) { animation-delay:-.6s; }
    @keyframes rotate { to { transform:rotate(360deg); } }
    @keyframes pulse { 50% { opacity:.6; transform:scale(.985); } }
    @keyframes wave { to { transform:scaleY(.48); } }
    aside h1 { font-size:clamp(30px,4vw,52px); line-height:.98; letter-spacing:-2px; margin:0 0 18px; }
    .lede { color:#66707a; font-size:18px; line-height:1.55; margin:0 0 32px; }
    .state-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; }
    .dot { width:32px; height:6px; border:0; border-radius:99px; background:#c8ced4; cursor:pointer; transition:.2s; }
    .dot.active { width:54px; background:var(--state-color); }
    .meta { min-height:95px; margin-bottom:22px; }
    .meta strong { display:block; color:var(--state-color); font-size:13px; letter-spacing:1.7px; margin-bottom:8px; }
    .meta p { margin:0; font-size:20px; line-height:1.4; }
    .controls { display:flex; gap:12px; }
    .control { border:0; border-radius:18px; padding:15px 20px; font-weight:800; font-size:15px; cursor:pointer; color:#050708; box-shadow:0 8px 22px #20283018; }
    .control.a { background:#ffd000; } .control.b { background:#35b7ff; }
    .hint { margin-top:18px; color:#7c858d; font-size:13px; }
    @media (max-width:880px) { main { grid-template-columns:1fr; gap:34px; padding:24px 16px; } .watch{width:min(88vw,540px)} aside{max-width:560px;margin:auto} }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; } }
    body.device { width:466px; height:466px; min-height:466px; display:block; overflow:hidden; background:#050708; }
    body.device main, body.device .stage, body.device .watch, body.device .screen { width:466px; height:466px; }
    body.device main { display:block; padding:0; }
    body.device .watch { padding:0; border-radius:0; background:#050708; box-shadow:none; }
    body.device .screen { border-radius:0; box-shadow:none; }
    body.device aside { display:none; }
  </style>
</head>
<body>
  <main>
    <section class="stage"><div class="watch"><div class="screen"><svg id="screen" viewBox="0 0 466 466" role="img" aria-label="StopWatch Walkie state preview"></svg></div></div></section>
    <aside>
      <h1>StopWatch<br>Walkie</h1>
      <p class="lede">Computer preview of the exact six-state visual direction before the next firmware flash.</p>
      <div class="state-row" id="dots"></div>
      <div class="meta"><strong id="step"></strong><p id="description"></p></div>
      <div class="controls"><button class="control a" id="next">A · NEXT</button><button class="control b" id="back">B · BACK</button></div>
      <p class="hint">Press A / B or ← / → on the keyboard.</p>
    </aside>
  </main>
  <script>
    const states = [
      {key:'CONNECTING', eyebrow:'STOPWATCH WALKIE', title:'CONNECTING', detail:'Searching for your Mac', color:'#ffb84d', note:'Animated amber orbit while the watch looks for the Mac bridge.'},
      {key:'READY', eyebrow:'STOPWATCH WALKIE', title:'READY', detail:'Hold KEYA to talk', color:'#42f5b3', note:'Stable mint ring and microphone symbol: the system is available.'},
      {key:'RECORDING', eyebrow:'LIVE MICROPHONE', title:'LISTENING', detail:'Release KEYA to send', color:'#ff4f6d', note:'Coral waveform reacts to the real microphone level on hardware.'},
      {key:'TRANSCRIBING', eyebrow:'ON YOUR MAC', title:'THINKING', detail:'Turning speech into text', color:'#55c7ff', note:'Cyan orbit indicates activity without implying a fake percentage.'},
      {key:'RESULT', eyebrow:'MESSAGE RECEIVED', title:'DONE', detail:'Agent reply received', color:'#42f5b3', note:'Mint confirmation presents a short, calm result state.'},
      {key:'ERROR', eyebrow:'TRY AGAIN', title:'NOT SENT', detail:'bridge_unreachable', color:'#ff7657', note:'Orange-red error stays explicit and recoverable.'}
    ];
    const params = new URLSearchParams(location.search);
    const deviceMode = params.get('device') === '1';
    let index = Math.max(0, Math.min(states.length - 1, Number(params.get('state') || 0)));
    if (deviceMode) document.body.classList.add('device');
    const screen = document.querySelector('#screen');
    const dots = document.querySelector('#dots');
    const icon = (s) => {
      if (s.key === 'CONNECTING') return `<g class="rotor"><circle cx="233" cy="119" r="8" fill="${s.color}"/><circle cx="280" cy="200" r="7" fill="${s.color}"/><circle cx="186" cy="200" r="6" fill="${s.color}"/></g><circle cx="233" cy="173" r="8" fill="${s.color}"/><circle cx="233" cy="173" r="58" fill="none" stroke="#15191d" stroke-width="2"/><circle cx="233" cy="173" r="40" fill="none" stroke="#15191d" stroke-width="2"/>`;
      if (s.key === 'READY') return `<g fill="${s.color}"><rect x="208" y="119" width="50" height="82" rx="25"/><path d="M185 174 A48 48 0 0 0 281 174 M233 214 V238 M205 238 H261" fill="none" stroke="${s.color}" stroke-width="8" stroke-linecap="round"/></g><rect x="223" y="130" width="20" height="58" rx="10" fill="#050708"/>`;
      if (s.key === 'RECORDING') return `<g fill="${s.color}">${[24,44,62,34,82,54,108,72,96,46,76,32,58,40,20].map((h,i)=>`<rect class="bar" x="${146+i*12}" y="${173-h/2}" width="7" height="${h}" rx="3.5"/>`).join('')}</g>`;
      if (s.key === 'TRANSCRIBING') return `<circle cx="233" cy="173" r="67" fill="none" stroke="#15191d" stroke-width="2"/><circle cx="233" cy="173" r="28" fill="#15191d"/><g class="rotor" fill="${s.color}"><circle cx="233" cy="106" r="10"/><circle cx="291" cy="207" r="10"/><circle cx="175" cy="207" r="10"/></g>`;
      if (s.key === 'RESULT') return `<circle cx="233" cy="173" r="62" fill="none" stroke="${s.color}" stroke-width="4"/><path d="M204 174 L225 195 L267 150" fill="none" stroke="${s.color}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
      return `<circle cx="233" cy="173" r="62" fill="none" stroke="${s.color}" stroke-width="4"/><rect x="226" y="129" width="14" height="66" rx="7" fill="${s.color}"/><circle cx="233" cy="216" r="8" fill="${s.color}"/>`;
    };
    function render() {
      const s=states[index], moving=!deviceMode&&['CONNECTING','TRANSCRIBING'].includes(s.key);
      document.documentElement.style.setProperty('--state-color',s.color);
      screen.innerHTML=`<circle cx="233" cy="233" r="231" fill="#050708"/><circle cx="233" cy="233" r="216" fill="none" stroke="#15191d" stroke-width="7"/><circle class="${moving?'rotor':'pulse'}" cx="233" cy="233" r="216" fill="none" stroke="${s.color}" stroke-width="7" stroke-linecap="round" ${moving?'stroke-dasharray="82 1275"':''}/><text x="233" y="70" fill="#8d979f" font-size="14" font-weight="700" letter-spacing="2.2" text-anchor="middle">${s.eyebrow}</text>${icon(s)}<text x="233" y="297" fill="white" font-size="34" font-weight="800" text-anchor="middle">${s.title}</text><text x="233" y="335" fill="${s.color}" font-size="16" font-weight="650" text-anchor="middle">${s.detail}</text><circle cx="154" cy="376" r="18" fill="#ffd000"/><text x="154" y="381" fill="#050708" font-size="15" font-weight="800" text-anchor="middle">A</text><text x="154" y="408" fill="#8d979f" font-size="12" font-weight="700" text-anchor="middle">NEXT</text><circle cx="312" cy="376" r="18" fill="#35b7ff"/><text x="312" y="381" fill="#050708" font-size="15" font-weight="800" text-anchor="middle">B</text><text x="312" y="408" fill="#8d979f" font-size="12" font-weight="700" text-anchor="middle">BACK</text>`;
      document.querySelector('#step').textContent=`0${index+1} · ${s.key}`;
      document.querySelector('#description').textContent=s.note;
      dots.innerHTML=states.map((_,i)=>`<button class="dot ${i===index?'active':''}" data-index="${i}" aria-label="Show ${states[i].key}"></button>`).join('');
      dots.querySelectorAll('button').forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);render()});
    }
    const move=(delta)=>{index=(index+delta+states.length)%states.length;render()};
    document.querySelector('#next').onclick=()=>move(1); document.querySelector('#back').onclick=()=>move(-1);
    addEventListener('keydown',e=>{if(e.key.toLowerCase()==='a'||e.key==='ArrowRight')move(1);if(e.key.toLowerCase()==='b'||e.key==='ArrowLeft')move(-1)});
    render();
  </script>
</body>
</html>
