[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
    M5GFX=https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
    M5PM1=https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    M5IOE1=https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
    links2004/WebSockets @ 2.7.2
    bblanchon/ArduinoJson @ 7.4.3

[env:m5stack-stopwatch-ui-demo]
extends = env:m5stack-stopwatch
build_flags =
    ${env:m5stack-stopwatch.build_flags}
    -DWALKIE_UI_DEMO=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
build_unflags =
    -std=gnu++11
lib_deps =
