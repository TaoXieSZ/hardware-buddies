; ── Arduino 环境（现有）：猫猫头 GIF + 舵机 + LED + USB 串口协议 ─────────
[env:cores3-stackchan-agent]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -DUART_SCLK_DEFAULT=UART_SCLK_XTAL
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/m5stack/StackChan-BSP.git
    bitbank2/AnimatedGIF @ ^2.1.1

; ── ESP-IDF 语音固件在 voice-agent/ 子项目（独立 platformio.ini）──────
; PlatformIO 的 espidf 构建器要求 src/ 是 IDF 主组件，与本项目的 Arduino
; src/ 冲突，所以放到子目录。构建： cd voice-agent && pio run
