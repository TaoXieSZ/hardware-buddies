; StackChan Voice Agent — ESP-IDF project (separate from the Arduino firmware
; in the parent directory; PlatformIO's espidf builder requires src/ to be the
; IDF main component, so the two frameworks can't share one project dir).
;
; Pipeline: Wi-Fi -> Agora RTC (mic publish / speaker subscribe) ->
;           Agora Conversational AI Agent (ASR+TTS, LLM -> our agent-host).
[env:cores3-voice-agent]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = espidf
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; Force-pull the IDF5 compat shim (components/agora_iot_sdk/freertos_compat.c)
    ; before ld resolves Agora's prebuilt libahpl.a (archive-order safety).
    -Wl,--undefined=xTaskCreateRestrictedPinnedToCore
