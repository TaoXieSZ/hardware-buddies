[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBUDDY_BOARD_STICKS3=1
build_src_filter = +<*> -<tab5/> -<stackchan/> -<stackchan.backup-*/> -<roverc/> -<roverc_selftest/> +<buddies/>
lib_deps = 
	m5stack/M5Unified @ ^0.2.0
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0

[env:m5stack-sticks3-claude]
extends = env:m5stack-sticks3
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBUDDY_BOARD_STICKS3=1
	-DBUDDY_S3_MIC_CAPTURE=1
	-DBUDDY_BRAND_PREFIX=\"Claude-S3-\"
	-DBUDDY_BRAND_NAME=\"Claude\"
	-DBUDDY_DEFAULT_CHAR=\"clawd\"

[env:m5stack-sticks3-cursor]
extends = env:m5stack-sticks3
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBUDDY_BOARD_STICKS3=1
	-DBUDDY_S3_MIC_CAPTURE=1
	-DBUDDY_BRAND_PREFIX=\"Cursor-S3-\"
	-DBUDDY_BRAND_NAME=\"Cursor\"
	-DBUDDY_VARIANT_CURSOR=1
	-DBUDDY_DEFAULT_CHAR=\"clawd\"

[env:cores3-stackchan]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<stackchan/>
build_unflags = -std=gnu++11
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-std=gnu++17
	'-DSTACKCHAN_WIFI_SSID="${wifi_secrets.ssid}"'
	'-DSTACKCHAN_WIFI_PASS="${wifi_secrets.pass}"'
	'-DSTACKCHAN_DAEMON_HOST="${wifi_secrets.host}"'
	-DSTACKCHAN_DAEMON_PORT=${wifi_secrets.port}
	-DSTACKCHAN_AUDIO_PORT=5005
lib_deps = 
	m5stack/M5Unified @ ^0.2.0
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0
	https://github.com/m5stack/StackChan-BSP.git
	crankyoldgit/IRremoteESP8266 @ ^2.8.6
	https://github.com/m5stack/M5Unit-NFC.git
	https://github.com/GOB52/gob_GC0308.git#a488fc636d60b792e9af939a5f4cfbca9a962adf

[env:cores3-stackchan-claude]
extends = env:cores3-stackchan
build_unflags = -std=gnu++11
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-std=gnu++17
	'-DSTACKCHAN_WIFI_SSID="${wifi_secrets.ssid}"'
	'-DSTACKCHAN_WIFI_PASS="${wifi_secrets.pass}"'
	'-DSTACKCHAN_DAEMON_HOST="${wifi_secrets.host}"'
	-DSTACKCHAN_DAEMON_PORT=${wifi_secrets.port}
	-DUART_SCLK_DEFAULT=UART_SCLK_XTAL
	-DBUDDY_BRAND_PREFIX=\"Claude-SC-\"
	-DBUDDY_BRAND_NAME=\"Claude\"
	-DBUDDY_DEFAULT_CHAR=\"clawd\"

[env:cores3-stackchan-cursor]
extends = env:cores3-stackchan
build_unflags = -std=gnu++11
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-std=gnu++17
	'-DSTACKCHAN_WIFI_SSID="${wifi_secrets.ssid}"'
	'-DSTACKCHAN_WIFI_PASS="${wifi_secrets.pass}"'
	'-DSTACKCHAN_DAEMON_HOST="${wifi_secrets.host}"'
	-DSTACKCHAN_DAEMON_PORT=${wifi_secrets.port}
	-DUART_SCLK_DEFAULT=UART_SCLK_XTAL
	-DBUDDY_BRAND_PREFIX=\"Cursor-SC-\"
	-DBUDDY_BRAND_NAME=\"Cursor\"
	-DBUDDY_DEFAULT_CHAR=\"clawd\"

[env:cores3-stackchan-voice]
extends = env:cores3-stackchan
build_src_filter = -<*> +<stackchan/> -<stackchan/main.cpp> +<stackchan_voice/>
build_unflags = -std=gnu++11
build_flags = 
	${env:cores3-stackchan.build_flags}
	-DUART_SCLK_DEFAULT=UART_SCLK_XTAL
	-DBUDDY_DEFAULT_CHAR=\"clawd\"
	-DSTACKCHAN_DASHSCOPE_KEY=\"${wifi_secrets.dashscope_key}\"
lib_deps = 
	${env:cores3-stackchan.lib_deps}
	links2004/WebSockets @ ^2.4.1
extra_scripts = 
	pre:tools/patch_websockets_max.py
	pre:tools/gen_panel_html.py

[env:roverc-selftest]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags = 
	-DCORE_DEBUG_LEVEL=0
build_src_filter = -<*> +<roverc_selftest/>
lib_deps = 
	m5stack/M5Unified @ ^0.2.0

[env:audio_selftest]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DAUDIO_SELFTEST
build_src_filter = +<*> -<tab5/> -<stackchan/> -<stackchan_voice/> +<buddies/>
lib_deps = 
	m5stack/M5Unified @ ^0.2.0
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = m5stack-tab5-p4
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.flash_mode = qio
board_build.partitions = partitions_tab5_16MB.csv
board_build.filesystem = littlefs
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	'-DTAB5_WIFI_SSID="${wifi_secrets.ssid}"'
	'-DTAB5_WIFI_PASS="${wifi_secrets.pass}"'
build_src_filter = -<*> +<tab5/>
lib_deps = 
	m5stack/M5Unified @ ^0.2.17
	https://github.com/m5stack/M5GFX.git#develop
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I src/stackchan -I src/stackchan_voice
build_src_filter = -<*>

