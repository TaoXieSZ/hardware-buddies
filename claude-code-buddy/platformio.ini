; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = wifi_secrets.ini

[env:m5stickc-plus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags = 
	-DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<tab5/> -<stackchan/> -<stackchan_voice/> +<buddies/>
lib_deps = 
	m5stack/M5Unified @ ^0.2.0
	bitbank2/AnimatedGIF @ ^2.1.1
	bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus2-claude]
extends = env:m5stickc-plus2
upload_port = /dev/cu.usbserial-586B0297061
monitor_port = /dev/cu.usbserial-586B0297061
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBUDDY_BRAND_PREFIX=\"Claude-\"
	-DBUDDY_BRAND_NAME=\"Claude\"
	-DBUDDY_DEFAULT_CHAR=\"clawd\"
lib_deps = 
	gilmaimon/ArduinoWebsockets@^0.5.4
	m5stack/M5Unified@^0.2.19
	bitbank2/AnimatedGIF@^2.2.3
	bblanchon/ArduinoJson@^7.4.3

[env:m5stickc-plus2-cursor]
extends = env:m5stickc-plus2
upload_port = /dev/cu.usbserial-6D5AEF1D38
monitor_port = /dev/cu.usbserial-6D5AEF1D38
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBUDDY_BRAND_PREFIX=\"Cursor-\"
	-DBUDDY_BRAND_NAME=\"Cursor\"
	-DBUDDY_VARIANT_CURSOR=1
	-DBUDDY_DEFAULT_CHAR=\"clawd\"

