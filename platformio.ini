; StackChan (M5Stack CoreS3) firmware for personal-agent-runtime.
; Button-triggered text turn: press A -> HTTP POST to dispatch's voice gateway
; (/v1/voice/chat/completions) -> stackchan-voice agent -> reply shown on LCD.
;
; This build config is KNOWN-GOOD (proven to compile for CoreS3). The executor
; writes src/main.cpp + include/config.h only; do NOT change this file's
; platform/board/PSRAM settings — forcing qio_qspi randomises Speaker DMA reads.
[env:cores3-stackchan-agent]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    ; Compatibility shim: BSP's FTServo driver uses UART_SCLK_DEFAULT
    ; (newer ESP-IDF) but our pinned arduino-esp32 only exposes
    ; UART_SCLK_XTAL. The two map to the same clock source on S3.
    -DUART_SCLK_DEFAULT=UART_SCLK_XTAL
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/m5stack/StackChan-BSP.git
